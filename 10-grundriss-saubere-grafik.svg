      .door { fill: none; stroke: #8a826e; stroke-width: 2.5; stroke-linecap: round; }
      .label { font-family: Arial, Helvetica, sans-serif; fill: #2f2f2f; font-size: 22px; font-weight: 600; text-anchor: middle; }
