      .fixture { fill: none; stroke: #555; stroke-width: 2.3; }
      .thin { fill: none; stroke: #777; stroke-width: 1.6; }
      .plant { fill: #5d933d; opacity: .95; }
      .arrow { fill: none; stroke: #142052; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
