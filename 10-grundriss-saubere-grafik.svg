<svg xmlns="http://www.w3.org/2000/svg" width="854" height="768" viewBox="0 0 854 768" role="img" aria-labelledby="title desc">
  <title id="title">Grundriss nach Originalentwurf</title>
  <desc id="desc">Sauber nachgezeichnete Vektorgrafik des bereitgestellten Grundrissentwurfs mit gleicher Raumaufteilung, Möblierung und Beschriftung.</desc>
